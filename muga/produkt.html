<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Herrenmode aus eigener Herstellung von MUGA in Köln.">
<meta name="theme-color" content="#f6f2ea">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/basis.css">
<link rel="stylesheet" href="assets/css/rahmen.css">
<link rel="stylesheet" href="assets/css/shop.css">
<link rel="stylesheet" href="assets/css/seiten.css">
<script src="assets/js/config.js"></script>
<script src="assets/js/kern.js"></script>
<script src="assets/js/rahmen.js"></script>
<script src="daten/katalog.js" defer blocking="render"></script>
<script src="assets/js/seite-produkt.js" defer blocking="render"></script>
</head>
<body>
<muga-kopf></muga-kopf>
<noscript><p class="ohne-skript">Für die Artikelansicht wird JavaScript benötigt. Sie erreichen uns auch telefonisch unter 0221 839 25 90.</p></noscript>

<main id="inhalt">
  <div class="huelle">
    <nav aria-label="Brotkrumen" style="padding-top:1.6rem"><ol class="kruemel" id="kruemel"><li><a href="index.html">Start</a></li><li><a href="kollektion.html">Kollektion</a></li></ol></nav>

    <div class="produkt" id="produkt">
      <div class="galerie">
        <div class="galerie__gross schimmer"></div>
      </div>
      <div class="kauf" aria-busy="true">
        <p class="kauf__art schimmer">Artikel wird geladen</p>
        <h1 class="schimmer">Artikel wird geladen</h1>
        <p class="schimmer" style="height:2.4rem;width:11rem">&nbsp;</p>
        <p class="schimmer" style="height:9rem">&nbsp;</p>
      </div>
    </div>
  </div>

  <section class="abschnitt abschnitt--leinen" id="dazu" hidden>
    <div class="huelle">
      <div class="kopfzeile kopfzeile--breit">
        <div class="stapel"><p class="vorspann">Das Outfit vervollständigen</p><h2>Passt <em>dazu</em></h2></div>
        <div class="reihe__knoepfe">
          <button class="reihe__knopf" type="button" data-reihe="-1" aria-label="Zurück blättern" disabled><svg class="symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
          <button class="reihe__knopf" type="button" data-reihe="1" aria-label="Weiter blättern"><svg class="symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="reihe"><div class="reihe__bahn" id="dazu-bahn" tabindex="0" aria-label="Passende Artikel"></div></div>
    </div>
  </section>

  <section class="abschnitt" id="gesehen" hidden>
    <div class="huelle">
      <div class="kopfzeile"><p class="vorspann">Ihr Verlauf</p><h2>Zuletzt <em>angesehen</em></h2></div>
      <div class="produktraster" id="gesehen-raster" style="--spalten:4"></div>
    </div>
  </section>

  <dialog class="grossbild" id="grossbild" aria-label="Großansicht">
    <div class="grossbild__kopf">
      <span id="grossbild-zahl"></span>
      <button class="symbolknopf" type="button" data-schliessen aria-label="Großansicht schließen"><svg class="symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="grossbild__buehne">
      <img id="grossbild-bild" alt="">
      <button class="grossbild__pfeil grossbild__pfeil--links" type="button" data-blatt="-1" aria-label="Vorheriges Bild"><svg class="symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button class="grossbild__pfeil grossbild__pfeil--rechts" type="button" data-blatt="1" aria-label="Nächstes Bild"><svg class="symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <p class="grossbild__fuss" id="grossbild-name"></p>
  </dialog>
</main>

<muga-fuss></muga-fuss>
</body>
</html>
