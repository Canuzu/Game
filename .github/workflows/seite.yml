# Veröffentlicht das Spiel unter https://canuzu.github.io/Game/
#
# Bei jedem Push auf den Hauptzweig laufen erst die Tests; nur wenn die
# durchgehen, wird die Seite neu gebaut und auf den Zweig gh-pages geschoben,
# von dem GitHub Pages ausliefert. Geht ein Test schief, bleibt die erreichbare
# Seite auf dem letzten funktionierenden Stand.
#
# Der Weg über einen Zweig ist hier bewusst gewählt: den Actions-Weg müsste man
# in den Repo-Einstellungen freischalten, den Zweig richtet GitHub von selbst
# ein — der Workflow-Token darf keine Pages-Seite anlegen.
name: Seite veröffentlichen

on:
  push:
    branches: [claude/chess-game-ai-multiplayer-su1ivy]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seite
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regelwerk und Spielstärke prüfen
        run: npm test

      - name: Einzeldatei-Fassung erzeugen
        run: node tools/build-single.mjs

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js _site/
          # Zum Herunterladen und Weitergeben: alles in einer einzigen Datei
          cp dist/schach.html _site/schach-einzeldatei.html
          # Ohne diese Datei schickt GitHub die Seite durch Jekyll
          touch _site/.nojekyll

      - name: Auf gh-pages schieben
        run: |
          cd _site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Schach als Webseite — Stand ${GITHUB_SHA::7}

          Erzeugt aus dem Hauptzweig. Nicht von Hand bearbeiten."
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
