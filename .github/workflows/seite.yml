# Veröffentlicht das Spiel unter https://canuzu.github.io/Game/
#
# Läuft bei jedem Push auf den Hauptzweig. Die Tests laufen vorher mit: geht
# einer schief, wird nichts veröffentlicht — die erreichbare Seite bleibt dann
# lieber auf dem letzten funktionierenden Stand.
name: Seite veröffentlichen

on:
  push:
    branches: [claude/chess-game-ai-multiplayer-su1ivy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Veröffentlichungen gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regelwerk und Spielstärke prüfen
        run: npm test

      - name: Einzeldatei-Fassung erzeugen
        run: node tools/build-single.mjs

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js _site/
          # Zum Herunterladen und Weitergeben: alles in einer Datei
          cp dist/schach.html _site/schach-einzeldatei.html

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
